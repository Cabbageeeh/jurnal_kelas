<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — Jurnal Kelas Digital</title>

    <!-- SEO & Meta -->
    <meta
      name="description"
      content="Sistem Jurnal Kelas Digital — Pencatatan kegiatan belajar mengajar"
    />
    <meta name="theme-color" content="#4F46E5" />

    <!-- Favicon emoji (tidak perlu file gambar) -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📒</text></svg>"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/login.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="login-page">
      <div class="login-container">
        <div class="login-card">
          <!-- Header -->
          <div class="login-header">
            <div class="login-logo">
              <i class="fas fa-book-open"></i>
            </div>
            <h1 class="login-title">Jurnal Kelas Digital</h1>
            <p class="login-subtitle">Masukkan username dan password Anda</p>
          </div>

          <!-- Form Login -->
          <form class="login-form" id="loginForm" onsubmit="handleLogin(event)">
            <div class="alert alert-danger hidden" id="loginAlert">
              <i class="fas fa-circle-exclamation"></i>
              <span id="loginAlertMsg">Username atau password salah.</span>
            </div>

            <div class="form-group">
              <label class="form-label" for="username">Username</label>
              <div class="input-icon-wrapper">
                <i class="fas fa-user icon"></i>
                <input
                  type="text"
                  id="username"
                  class="form-control"
                  placeholder="Masukkan username"
                  autocomplete="username"
                  required
                />
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="password">Password</label>
              <div class="input-icon-wrapper">
                <i class="fas fa-lock icon"></i>
                <input
                  type="password"
                  id="password"
                  class="form-control"
                  placeholder="Masukkan password"
                  autocomplete="current-password"
                  required
                />
                <i
                  class="fas fa-eye icon-right"
                  id="togglePassword"
                  onclick="togglePasswordVisibility()"
                ></i>
              </div>
            </div>

            <button type="submit" class="btn-login" id="btnLogin">
              <span class="btn-text">
                <i class="fas fa-right-to-bracket"></i>
                Masuk
              </span>
              <span class="btn-spinner"></span>
            </button>
          </form>

          <div style="text-align: center; padding: 0 28px 16px">
            <button
              class="dark-mode-toggle"
              onclick="toggleDarkMode()"
              id="darkModeBtn"
              title="Toggle Dark Mode"
              style="margin: 0 auto"
            >
              <i class="fas fa-moon"></i>
            </button>
          </div>

          <div class="login-footer">
            <i class="fas fa-shield-halved"></i>
            Sistem Jurnal Kelas &copy; 2025 — Akses sesuai hak pengguna
          </div>
        </div>
      </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/darkmode.js"></script>
  </body>
</html>
